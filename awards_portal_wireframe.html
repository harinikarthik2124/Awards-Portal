<p>${(d.su||[]).map((x,k)=>`<button class="b" style="margin:0 6px 6px 0" onclick="RS=${k};R()">${x[0]}</button>`).join('')||'<small>No supporting info added</small>'}</p>${RS>=0&&d.su[RS]?`<div class="note">${d.su[RS][1]}</div>`:''}
<p><b>Release period:</b> ${f.from||'-'} to ${f.to||'-'}<br><b>Release platforms:</b> ${(d.pl||[]).join(', ')||'-'}</p>${perf?`<p><b>Artiste:</b> ${f.art||'-'} ${f.cart||''}<br><b>Role played:</b> ${f.role||'-'} ${f.crole||''}</p>`:''}
${(adm||role=='sub')?`<div style="background:#d3d6da;border-radius:8px;padding:10px 14px"><b>Company:</b> ${f.co||'-'}<br>${f.em||''}<br><b>Contact:</b> ${f.cp||'-'} · ${f.mob||'-'}</div>`:'<div class="note">Submitter details are hidden from panellists and judges (to be confirmed).</div>'}</div></div>`;
else b=`<table class="jt"><tr><th>Type</th><th>Description</th><th>View Recommended Episode(s)/Video</th></tr><tr><td>Video</td><td>Episode 01</td><td><a href="#" onclick="RP='Episode 01';R();return false">Open</a> <small>${d.l1||'-'}</small></td></tr><tr><td>Video</td><td>Recommended episode</td><td><a href="#" onclick="RP='Recommended episode';R();return false">Open</a> <small>${d.l2||'-'}</small></td></tr>${(d.tc||[]).map(t=>`<tr><td>Time code</td><td>${t}</td><td>-</td></tr>`).join('')}${e.reel?`<tr><td>Video</td><td>5-min nominee reel</td><td><a href="#" onclick="RP='5-min nominee reel';R();return false">Open</a> <small>${e.reel}</small></td></tr>`:''}</table>
${RP?`<div style="margin-top:12px;background:#111;color:#fff;border-radius:6px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:44px">▶</div><div>${RP}</div><small>Episode player (placeholder)</small></div>`:''}
${adm?`<div class="card" style="margin-top:12px"><b>5-min nominee reel</b> (uploaded by Admin)<br><input type="file" accept="video/*" onchange="E[${i}].reel=this.files[0]?this.files[0].name:'';R()"> <small>${e.reel||'No reel uploaded'}</small></div>`:''}`;
const act=adm?`<button class="b g" ${v?'disabled':''} onclick="E[${i}].st='Validated';toast('Entry validated');${back}">${v?'Validated':'Validate'}</button>`:role=='jdg'&&DB.c!==undefined&&!JS[DB.c]?`<button class="b" style="background:#17a2b8" onclick="scr(${DB.c},'${e.id}')">Score</button>`:'';
return `<div class="card"><h2 style="margin:0 0 10px">${adm?'Review entry':role=='sub'?'Entry summary':'Entry'} ${e.id} ${adm||role=='sub'?tag(e.st):''}</h2>${role=='sub'?`<div class="note">${e.st=='Validated'?'This entry has been validated by the Awards Working Committee.':'This entry has been submitted.'} It can no longer be edited.</div>`:''}<div class="tabs"><a class="${RT?'':'on'}" onclick="RT=0;R()">General Info</a><a class="${RT?'on':''}" onclick="RT=1;R()">Judging Materials</a></div>${b}
<div class="bar"><button class="b k" onclick="${back}">← Back</button>${act}</div></div>`}

/* ---------- NOMINATION PANELLIST ---------- */
function nomV(){if(view=='me')return me(U.n);if(view=='det')return detV(cur);
if(!R_.nom)return `<h2>Ranking for Nominees</h2><div class="note">No entries released yet. Admin → Panels &amp; Release.</div>`;
if(view=='home')return ovHTML('n');
if(cur!==null&&cur!==undefined)return nomL(cur);
if(!AC.some((c,i)=>my(i)))return `<h2>Ranking for Nominees</h2><div class="note">No categories assigned to you yet. The Admin assigns categories under Panels &amp; Release.</div>`;
return `<h2>Ranking for Nominees</h2><p class="sub">You only see the categories assigned to you.</p><p class="leg"><span>Not started</span><span class="t1">In progress</span><span class="t2">Submitted</span></p><div class="grid">${AC.map((c,i)=>!my(i)?'':`<div class="tile t${catSt(i)}" onclick="go('ov',${i})"><b>${c}</b><small>${tyC(i)} · ${['Not started','In progress ('+(V[i]||[]).length+' Yes · '+Math.min(ent(i).length,(V[i]||[]).length+(V['n'+i]||[]).length)+'/'+ent(i).length+' ranked)','Submitted'][catSt(i)]}</small></div>`).join('')}</div>`}
let NQ='';
function nomL(c){const L=ent(c),v=V[c]=V[c]||[],nl=V['n'+c]=V['n'+c]||[],need=Math.min(5,L.length),lk=NS[c],ready=v.length==need&&L.every(e=>v.includes(e.id)||nl.includes(e.id)),q=NQ.toLowerCase(),F=L.filter(e=>!q||(e.name+e.pr).toLowerCase().includes(q));
return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px"><div><b>Entries</b><br>Type : ${tyC(c)} · Category : ${AC[c]}<br><small>Rank Yes for your top ${need}, then mark every other entry as Null. Yes: <b>${v.length}/${need}</b> · Ranked: <b>${Math.min(L.length,v.length+nl.length)}/${L.length}</b></small>${!lk&&!ready?`<br><small class="em">Submit unlocks when ${need} entries are Yes and all the rest are Null.</small>`:''}</div>
<div><button class="b y" ${lk||!ready?'disabled':''} onclick="subN(${c})">${lk?'Submitted':'Submit'}</button> <button class="b g" ${lk?'disabled':''} onclick="toast('Progress saved')">Save</button> <button class="b" onclick="NQ='';go('ov')">← Back</button></div></div>
<div style="display:flex;justify-content:space-between;margin:14px 0 8px;flex-wrap:wrap;gap:8px"><span>Show <select style="width:auto"><option>25</option><option>50</option></select> entries</span><span>Search: <input type="text" id="nq" style="width:170px" value="${NQ}" oninput="NQ=this.value;R();var x=$('#nq');x.focus();x.setSelectionRange(99,99)"></span></div>
<table class="jt nt"><tr><th>Ref No</th><th>Name of Host/Performer</th><th>Programme Title - Role Name / Video/Audio URL</th><th>Rank: Yes</th><th>Rank: Null</th><th>Remarks<br><small>Please avoid using special characters</small></th></tr>${F.map(e=>`<tr><td>${e.id}</td><td>${e.name}</td><td><a href="#" onclick="openD(${E.indexOf(e)},'ov',${c});return false">▣ ${e.pr}</a></td><td><input type="checkbox" ${v.includes(e.id)?'checked':''} ${lk?'disabled':''} onchange="rank(${c},'${e.id}',1,this)"></td><td><input type="checkbox" ${nl.includes(e.id)?'checked':''} ${lk?'disabled':''} onchange="rank(${c},'${e.id}',0,this)"></td><td><input type="text" ${lk?'disabled':''} value="${V['r'+e.id]||''}" oninput="V['r${e.id}']=this.value"></td></tr>`).join('')}</table>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><small>Showing ${F.length?1:0} to ${F.length} of ${F.length} entries</small><span class="tag">1</span></div></div>`}
function rank(c,id,y,el){const v=V[c]=V[c]||[],n=V['n'+c]=V['n'+c]||[];
if(y){if(!el.checked){v.splice(v.indexOf(id),1)}else{if(v.length>=5){el.checked=false;toast('Maximum 5 Yes votes');return}const k=n.indexOf(id);if(k>=0)n.splice(k,1);v.push(id)}}
else{if(el.checked){const k=v.indexOf(id);if(k>=0)v.splice(k,1);if(!n.includes(id))n.push(id)}else{const k=n.indexOf(id);if(k>=0)n.splice(k,1)}}R()}
function crit(){open_(`<h3>Judging Criteria</h3><div class="note">Criteria are TBC (see Open Questions).</div><button class="b l" onclick="close_()">Close</button>`)}
function pick(c,id,el){const v=V[c];if(el.checked){if(v.length>=5){el.checked=false;toast('Maximum 5 selections');return}v.push(id)}else v.splice(v.indexOf(id),1);R()}
function sum(id){const e=E.find(x=>x.id==id);open_(`<h3>Entry summary</h3><p><b>${e.name}</b> · ${e.pr}</p><p>${e.cat}</p><p>Submitter identity shown or hidden: TBC. Episode player would embed here.</p><button class="b l" onclick="close_()">Close</button>`)}
function subN(c){open_(`<h3>Confirm nominations</h3><ol>${V[c].map(id=>`<li>${E.find(e=>e.id==id).name}</li>`).join('')}</ol><p class="em">Changes after submission: TBC.</p><div class="bar"><button class="b l" onclick="close_()">Back</button><button class="b g" onclick="NS[${c}]=1;close_();toast('Nominations submitted. Confirmation email sent.');R()">Confirm &amp; submit</button></div>`)}

/* ---------- JUDGE ---------- */
const TRO='<svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M7 3h10v2h3v3c0 2.2-1.7 4-3.9 4.3A5 5 0 0 1 13 15.9V18h3v2H8v-2h3v-2.1A5 5 0 0 1 7.9 12.3C5.7 12 4 10.2 4 8V5h3V3zM6 7H5v1c0 .8.4 1.5 1 1.9V7zm12 0v2.9c.6-.4 1-1.1 1-1.9V7h-1z"/></svg>';
const isPg=c=>PR[P].TY.Programme.includes(c),jb=i=>jSt(i)==2?['g','Submitted']:jSt(i)==1?['y','In progress']:['p','Pending'],bd=a=>`<span class="bd ${a[0]}">${a[1]}</span>`;
let JQ='';
function jdgV(){if(view=='me')return me(U.n);if(view=='det')return detV(cur);
if(!R_.jdg)return `<div class="card"><b>Scoring for Nominees</b><div class="note" style="margin-top:10px">Shortlist not released yet. Admin → Panels &amp; Release → Confirm shortlist.</div></div>`;
if(!AC.some((c,i)=>my(i)))return `<div class="card"><b>Scoring for Nominees</b><div class="note" style="margin-top:10px">No categories assigned to you yet. The Admin assigns categories under Panels &amp; Release.</div></div>`;
if(view=='home')return ovHTML('j');
if(view=='sc')return `<div class="card"><b>Overview of Scores</b><table class="jt" style="margin-top:10px"><tr><th>Category</th><th>Nominee</th><th>Total</th></tr>${AC.flatMap((c,i)=>!my(i)?[]:sl(i).map(e=>`<tr><td>${c}</td><td>${e.name}</td><td>${tot(e)||'-'}</td></tr>`)).join('')}</table></div>`;
if(cur!==null&&cur!==undefined){const c=cur,L=sl(c),q=JQ.toLowerCase(),F=L.filter(e=>!q||(e.name+e.pr).toLowerCase().includes(q)),all=L.length&&L.every(e=>SC[e.id]),lk=JS[c];
return `<div style="background:#e9ecef;padding:8px 12px;border-radius:4px;margin-bottom:10px"><a href="#" onclick="JQ='';go('home');return false">Home</a> / <a href="#" onclick="JQ='';go('ov');return false">Nominees</a> / Nominees List</div>
<div class="card"><div style="display:flex;gap:40px;flex-wrap:wrap;margin-bottom:10px"><span>Evaluation Name <b style="margin-left:14px">${pn().toUpperCase()}</b></span><span>Economy <b style="margin-left:14px">Singapore</b></span></div>
<div style="text-align:right;margin-bottom:8px">Search: <input type="text" id="jq" style="width:170px" value="${JQ}" oninput="JQ=this.value;R();var x=$('#jq');x.focus();x.setSelectionRange(99,99)"></div>
<div style="overflow-x:auto"><table class="jt"><tr><th>ID</th><th>Ref No</th><th>Nominee</th><th>Type</th><th>Category</th><th>Name of Role Played (Indicate NA if not applicable)</th><th>Title of Programme Nominated</th><th>Economy</th><th>Score</th><th>Status</th><th>Action</th></tr>${F.map((e,k)=>`<tr><td>${k+1}</td><td>${e.id}</td><td>${e.name}</td><td>${tyC(c)}</td><td>${AC[c]}</td><td>${tyC(c)=='Performance'?((e.d&&e.d.f.role)||'NA'):''}</td><td>${e.pr}</td><td>Singapore</td><td>${tot(e)}</td><td>${bd(lk?['g','Submitted']:SC[e.id]?['y','Saved']:['p','Pending'])}</td><td style="white-space:nowrap"><button class="b y" onclick="openD(${E.indexOf(e)},'ov',${c})">View</button> <button class="b" style="background:#17a2b8" ${lk?'disabled':''} onclick="scr(${c},'${e.id}')">Score</button></td></tr>`).join('')}</table></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><small>Showing ${F.length?1:0} to ${F.length} of ${F.length} entries</small><span class="tag">1</span></div>
<div class="bar"><button class="b k" onclick="JQ='';go('ov')">← Back</button><button class="b g" ${!all||lk?'disabled':''} onclick="JS[${c}]=1;toast('Scores submitted. Confirmation email sent.');R()">${lk?'Submitted':'Submit scores for category'}</button></div></div>`}
return `<div class="card"><b>Scoring for Nominees</b><div class="g4">${AC.map((c,i)=>!my(i)?'':`<div class="ct ${isPg(c)?'pg':'pf'}" onclick="go('ov',${i})">${TRO}<b style="font-weight:600;padding-right:34px">${c}</b><small>${tyC(i)}</small>${bd(jb(i))}</div>`).join('')}</div></div>`}
function scr(c,id){const e=E.find(x=>x.id==id),s=SC[id]||{c:[5,5,5],m:''};
open_(`<h3>Score: ${e.name}</h3><p>${e.pr} · <a href="#" onclick="toast('Opens episode / 5-min reel player');return false">▶ Episode &amp; reel</a></p><div class="note">Judging criteria and scale are TBC. Placeholders shown.</div>${[0,1,2].map(k=>`<label>Criterion ${k+1} (0–10): <span id="v${k}">${s.c[k]}</span></label><input type="range" min="0" max="10" value="${s.c[k]}" oninput="$('#v${k}').textContent=this.value" id="c${k}">`).join('')}<label>Comments</label><textarea id="cm" rows="2">${s.m}</textarea>
<div class="bar"><button class="b l" onclick="close_()">Cancel</button><button class="b g" onclick="SC['${id}']={c:[0,1,2].map(k=>+$('#c'+k).value),m:$('#cm').value};close_();toast('Score saved');R()">Save score</button></div>`)}
function me(n){return `<h2>My Profile</h2><div class="card">${n}<br>${U.e}<br><small>Name, email, password reset: login method TBC.</small></div>`}
$('#jmp').innerHTML='<option value="">Jump to an awards show…</option>'+ORD.map(k=>`<option value="2026-${String(PR[k].w[0]).padStart(2,'0')}-${String(PR[k].w[1]).padStart(2,'0')}">${PR[k].n} (${fw(k)})</option>`).join('');SEED=JSON.stringify({E,ASG,JSG,ST,RR,LG});load();bind();R();
